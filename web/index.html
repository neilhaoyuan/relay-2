<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f3ee" />
    <meta name="description" content="Relay agent tasks" />
    <title>Relay</title>
  </head>
  <body>
    <div id="app">
      <header class="masthead">
        <div class="masthead-actions">
          <button id="new-task" class="button primary" type="button">New task</button>
        </div>
      </header>

      <main class="shell" id="shell">
        <section class="inbox" id="inbox" aria-label="Tasks">
          <div class="section-top">
            <div class="project-heading">
              <p class="eyebrow">Tasks For</p>
              <details id="project-switcher" class="project-switcher">
                <summary><span id="project-title">All projects</span><span class="project-chevron" aria-hidden="true"></span></summary>
                <div id="project-options" class="project-options" role="group" aria-label="Projects"></div>
              </details>
            </div>
            <button id="new-project" class="text-button" type="button">New project</button>
          </div>
          <div class="inbox-tools">
            <button id="filter-open" class="filter active" type="button" aria-pressed="true">Open</button>
            <button id="filter-all" class="filter" type="button" aria-pressed="false">All</button>
            <span id="updated-at" class="updated-at"></span>
          </div>
          <div id="task-list" class="task-list" aria-live="polite"></div>
        </section>

        <section class="detail" id="detail" aria-label="Task detail">
          <div id="detail-content"></div>
        </section>
      </main>

      <dialog id="dialog" class="dialog">
        <form id="dialog-form">
          <div class="dialog-head"><p id="dialog-kicker" class="eyebrow"></p><button id="close-dialog" class="icon-button" type="button" aria-label="Close dialog">×</button></div>
          <h2 id="dialog-title"></h2>
          <div id="dialog-fields"></div>
          <p id="dialog-error" class="form-error" role="alert"></p>
          <div class="dialog-actions"><button id="dialog-cancel" class="button" type="button">Cancel</button><button id="dialog-submit" class="button primary" type="submit">Continue</button></div>
        </form>
      </dialog>
      <div id="toast" class="toast" role="status" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
